<style>
:root{
  --ink:#23291f;
  --moss:#3f5340;
  --moss-dark:#2f3e30;
  --paper:#f2f3ee;
  --card:#ffffff;
  --stone:#75796d;
  --line:#dcdcd1;
  --gold:#b8862a;
  --gold-soft:#f3ead5;
  --radius:4px;
  --maxw:1080px;
  --mincho:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --gothic:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--gothic);font-size:16px;line-height:1.85;
  font-feature-settings:"palt" 1;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
.mincho{font-family:var(--mincho)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.site-header{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  background:rgba(242,243,238,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.header-in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;min-width:0}
.brand img{height:34px;width:auto}
.brand-name{font-family:var(--mincho);font-size:19px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
.brand-sub{font-size:12px;color:var(--stone);white-space:nowrap}
@media(max-width:600px){.brand-sub{display:none}}
.header-nav{display:flex;align-items:center;gap:22px;font-size:14px}
.header-nav a{text-decoration:none;color:var(--stone);padding:4px 0;border-bottom:1px solid transparent}
.header-nav a:hover{color:var(--ink);border-bottom-color:var(--gold)}
@media(max-width:700px){.header-nav a.hide-sp{display:none}}
.tel-link{font-family:var(--mincho);font-size:15px;color:var(--moss)!important;font-weight:600}

/* ---------- notice ---------- */
.notice{background:var(--gold-soft);border-bottom:1px solid #e6d9ba;font-size:14px}
.notice .wrap{padding-top:10px;padding-bottom:10px}

/* ---------- hero ---------- */
.hero{padding:64px 0 72px}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.hero h1{
  font-family:var(--mincho);font-weight:600;
  font-size:clamp(30px,5.2vw,50px);line-height:1.45;letter-spacing:.02em;
  margin:0 0 24px;
}
.hero p{max-width:34em;color:#3c4237;margin:0 0 32px}
.hero-photo{position:relative}
.hero-photo .frame{position:absolute;inset:16px -16px -16px 16px;background:var(--moss);border-radius:var(--radius)}
.hero-photo img{position:relative;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:var(--radius)}
@media(max-width:820px){
  .hero{padding:36px 0 48px}
  .hero-grid{grid-template-columns:1fr;gap:34px}
  .hero-photo{order:-1}
  .hero-photo img{aspect-ratio:4/3}
  .hero-photo .frame{inset:12px -12px -12px 12px}
}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:15px 28px;border-radius:var(--radius);border:1px solid transparent;
  text-decoration:none;font-weight:700;font-size:16px;letter-spacing:.02em;
  transition:background .18s,color .18s,border-color .18s;
}
.btn-primary{background:var(--moss);color:#fff}
.btn-primary:hover{background:var(--moss-dark)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--moss);color:var(--moss)}
.btn-block{width:100%}
.btn[aria-disabled="true"]{background:#cfd2c8;color:#6d7166;cursor:not-allowed;pointer-events:none}

/* ---------- section ---------- */
.section{padding:72px 0}
.section--paperwhite{background:#fbfbf8;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.section-head{margin:0 0 40px}
.section-head h2{font-family:var(--mincho);font-weight:600;font-size:clamp(23px,3.4vw,31px);margin:0 0 8px;letter-spacing:.03em}
.section-head p{margin:0;color:var(--stone);font-size:15px}
@media(max-width:820px){.section{padding:52px 0}}

/* ---------- lesson cards (nursery-tag treatment) ---------- */
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px}
.tag-card{
  background:var(--card);border:1px solid var(--line);border-top:3px solid var(--moss);
  border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;
}
.tag-card.is-closed{opacity:.72}
.tag-card .photo{position:relative;aspect-ratio:3/2;background:#e7e8e0}
.tag-card .photo img{width:100%;height:100%;object-fit:cover}
.chip{
  position:absolute;top:12px;left:12px;background:#fff;color:var(--moss);
  border:1px solid var(--line);border-left:3px solid var(--gold);
  font-size:12px;font-weight:700;padding:4px 10px;border-radius:2px;letter-spacing:.04em;
}
.chip.is-full{border-left-color:#9a9a90;color:var(--stone)}
.tag-body{padding:22px 22px 24px;display:flex;flex-direction:column;flex:1}
.tag-body h3{font-family:var(--mincho);font-size:21px;font-weight:600;margin:0 0 6px;line-height:1.5}
.when{font-size:14px;color:var(--moss);font-weight:700;margin:0 0 14px}
.tag-card .lead{font-size:14.5px;color:#4a5044;margin:0 0 18px;flex:1;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.spec{margin:0 0 20px;border-top:1px solid var(--line);font-size:14px}
.spec div{display:flex;gap:12px;padding:8px 0;border-bottom:1px dotted var(--line)}
.spec dt{flex:0 0 5.2em;color:var(--stone);margin:0}
.spec dd{margin:0;flex:1;min-width:0}
.price{font-family:var(--mincho);font-size:19px;font-weight:700}
.card-actions{display:grid;gap:10px}
.card-actions .btn{padding:13px 18px;font-size:15px}

.empty{
  border:1px dashed var(--line);border-radius:var(--radius);
  padding:56px 24px;text-align:center;color:var(--stone);background:#fbfbf8;
}

/* ---------- flow ---------- */
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:0;counter-reset:step}
.flow li{list-style:none;counter-increment:step;padding:0 28px;border-left:1px solid var(--line)}
.flow li:first-child{padding-left:0;border-left:0}
.flow li::before{
  content:counter(step);font-family:var(--mincho);font-size:13px;color:var(--gold);
  display:block;margin-bottom:10px;border-bottom:1px solid var(--gold);width:1.6em;padding-bottom:4px;
}
.flow h3{font-size:16px;margin:0 0 6px;font-weight:700}
.flow p{margin:0;font-size:14.5px;color:#4a5044}
@media(max-width:760px){
  .flow{grid-template-columns:1fr;gap:26px}
  .flow li{padding:0 0 0 0;border-left:0;border-top:1px solid var(--line);padding-top:20px}
  .flow li:first-child{border-top:0;padding-top:0}
}

/* ---------- access ---------- */
.access-grid{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:start}
.access dl{margin:0;border-top:1px solid var(--line)}
.access dl>div{display:flex;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.access dt{flex:0 0 6em;color:var(--stone);font-size:14px;margin:0}
.access dd{margin:0;flex:1}
.map{width:100%;aspect-ratio:1/1;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#e7e8e0}
.map iframe{width:100%;height:100%;border:0;display:block}
@media(max-width:820px){.access-grid{grid-template-columns:1fr;gap:28px}.map{aspect-ratio:4/3}}

/* ---------- footer ---------- */
.site-footer{background:var(--moss-dark);color:#cfd6c8;padding:48px 0 calc(40px + env(safe-area-inset-bottom,0px));font-size:14px}
.site-footer a{color:#e7eede}
.footer-in{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:flex-end}
.footer-brand{font-family:var(--mincho);font-size:20px;color:#fff;margin:0 0 6px}
.copy{font-size:12.5px;color:#9daa95;margin:24px 0 0}

/* ---------- detail page ---------- */
.detail{padding:32px 0 96px}
.back{display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:var(--stone);padding:6px 0;margin-bottom:22px}
.back:hover{color:var(--moss)}
.detail-hero{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:#e7e8e0}
.detail-hero img{width:100%;aspect-ratio:16/9;object-fit:cover}
.detail-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:48px;margin-top:40px;align-items:start}
.detail h1{font-family:var(--mincho);font-weight:600;font-size:clamp(25px,4vw,36px);line-height:1.5;margin:0 0 12px}
.detail .body{white-space:pre-wrap;color:#3c4237;margin:0 0 36px;max-width:38em}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--radius);border:1px solid var(--line)}
.video{grid-column:1/-1;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.video iframe{width:100%;height:100%;border:0}
.panel{background:#fff;border:1px solid var(--line);border-top:3px solid var(--moss);border-radius:var(--radius);padding:24px;position:sticky;top:96px}
.panel h2{font-size:15px;margin:0 0 4px;letter-spacing:.06em;font-weight:700}
.panel .spec{margin-top:14px}
.note{font-size:12.5px;color:var(--stone);text-align:center;margin:10px 0 0}
@media(max-width:900px){
  .detail-grid{grid-template-columns:1fr;gap:32px}
  .panel{position:static}
  .detail{padding-bottom:120px}
}
.sticky-cta{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:none;
  background:rgba(255,255,255,.95);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
}
@media(max-width:900px){.sticky-cta.on{display:block}}

.loading{padding:120px 20px;text-align:center;color:var(--stone)}
</style>
</head>

<script>
(function(){
  "use strict";

  var DATA = null;
  var PLACEHOLDER = "data:image/svg+xml," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80"><rect width="120" height="80" fill="#e7e8e0"/><path d="M60 58V36" stroke="#9aa392" stroke-width="2.5" stroke-linecap="round"/><path d="M60 44c-10 0-14-6-14-14 10 0 14 6 14 14zM60 50c10 0 14-6 14-14-10 0-14 6-14 14z" fill="#b6c0ac"/></svg>'
  );

  /* ---------- helpers ---------- */
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function img(src, alt, cls){
    var u = src ? esc(src) : PLACEHOLDER;
    return '<img src="' + u + '" alt="' + esc(alt || "") + '" loading="lazy" decoding="async" ' +
           (cls ? 'class="' + cls + '" ' : "") +
           'onerror="this.onerror=null;this.src=\'' + PLACEHOLDER + '\'">';
  }
  function safeUrl(u){
    u = String(u || "").trim();
    return /^https?:\/\//i.test(u) ? u : "";
  }
  function isOpen(l){ return l.status !== "満席" && l.status !== "受付終了"; }
  function youtubeEmbed(url){
    var m = String(url || "").match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/))([A-Za-z0-9_-]{6,})/);
    return m ? "https://www.youtube.com/embed/" + m[1] : "";
  }
  function specRows(l){
    var rows = [
      ["日程", l.schedule], ["料金", l.price], ["所要時間", l.duration],
      ["定員", l.capacity], ["対象", l.level], ["持ち物", l.bring]
    ];
    return '<dl class="spec">' + rows.filter(function(r){ return r[1]; }).map(function(r){
      var v = r[0] === "料金" ? '<span class="price">' + esc(r[1]) + '</span>' : esc(r[1]);
      return '<div><dt>' + esc(r[0]) + '</dt><dd>' + v + '</dd></div>';
    }).join("") + '</dl>';
  }
  function reserveBtn(l, block){
    var u = safeUrl(l.reserveUrl);
    if (!isOpen(l) || !u) {
      return '<span class="btn btn-primary' + (block ? " btn-block" : "") + '" aria-disabled="true">' +
             (l.status === "満席" ? "満席になりました" : "現在受付していません") + '</span>';
    }
    return '<a class="btn btn-primary' + (block ? " btn-block" : "") + '" href="' + esc(u) +
           '" target="_blank" rel="noopener noreferrer">空き状況を見て予約する</a>';
  }

  /* ---------- header / footer ---------- */
  function header(){
    var s = DATA.site, logo = s.logo ? '<img src="' + esc(s.logo) + '" alt="" onerror="this.remove()">' : "";
    var tel = s.access && s.access.tel ? s.access.tel : "";
    return '<header class="site-header"><div class="wrap header-in">' +
      '<a class="brand" href="#/">' + logo +
        '<span class="brand-name">' + esc(s.name) + '</span>' +
        '<span class="brand-sub">' + esc(s.tagline || "") + '</span>' +
      '</a>' +
      '<nav class="header-nav" aria-label="サイト内">' +
        '<a href="#lessons" class="hide-sp">教室一覧</a>' +
        '<a href="#access" class="hide-sp">アクセス</a>' +
        (tel ? '<a class="tel-link" href="tel:' + esc(tel.replace(/[^0-9+]/g,"")) + '">' + esc(tel) + '</a>' : "") +
      '</nav>' +
    '</div></header>' +
    (s.notice ? '<div class="notice"><div class="wrap">' + esc(s.notice) + '</div></div>' : "");
  }

  function footer(){
    var s = DATA.site, a = s.access || {};
    return '<footer class="site-footer"><div class="wrap">' +
      '<div class="footer-in">' +
        '<div><p class="footer-brand">' + esc(s.name) + '</p>' +
          '<p style="margin:0">' + esc(a.address || "") + '</p></div>' +
        '<div>' +
          (a.tel ? '<p style="margin:0">電話 <a href="tel:' + esc(String(a.tel).replace(/[^0-9+]/g,"")) + '">' + esc(a.tel) + '</a></p>' : "") +
          (a.email ? '<p style="margin:0">メール <a href="mailto:' + esc(a.email) + '">' + esc(a.email) + '</a></p>' : "") +
        '</div>' +
      '</div>' +
      '<p class="copy">&copy; ' + new Date().getFullYear() + ' ' + esc(s.name) + '</p>' +
    '</div></footer>';
  }

  /* ---------- home ---------- */
  function home(){
    var s = DATA.site, list = DATA.lessons || [];
    var open = list.filter(isOpen), closed = list.filter(function(l){ return !isOpen(l); });

    var hero = '<section class="hero"><div class="wrap hero-grid">' +
      '<div>' +
        '<h1>' + esc(s.heroHeading || "").split("\n").map(esc).join("<br>") + '</h1>' +
        '<p>' + esc(s.heroText || "") + '</p>' +
        '<a class="btn btn-primary" href="#lessons">開催中の教室を見る</a>' +
      '</div>' +
      '<div class="hero-photo"><div class="frame"></div>' + img(s.heroImage, "寄せ植え教室のようす") + '</div>' +
    '</div></section>';

    var cards = function(arr){
      return '<div class="lesson-grid">' + arr.map(function(l){
        return '<article class="tag-card' + (isOpen(l) ? "" : " is-closed") + '">' +
          '<div class="photo">' + img(l.image, l.title) +
            (l.status ? '<span class="chip' + (isOpen(l) ? "" : " is-full") + '">' + esc(l.status) + '</span>' : "") +
          '</div>' +
          '<div class="tag-body">' +
            '<h3>' + esc(l.title) + '</h3>' +
            (l.schedule ? '<p class="when">' + esc(l.schedule) + '</p>' : "") +
            '<p class="lead">' + esc(l.desc) + '</p>' +
            '<dl class="spec"><div><dt>料金</dt><dd><span class="price">' + esc(l.price) + '</span></dd></div>' +
              (l.duration ? '<div><dt>時間</dt><dd>' + esc(l.duration) + '</dd></div>' : "") +
              (l.capacity ? '<div><dt>定員</dt><dd>' + esc(l.capacity) + '</dd></div>' : "") +
            '</dl>' +
            '<div class="card-actions">' +
              '<a class="btn btn-ghost" href="#/lesson/' + encodeURIComponent(l.id) + '">くわしく見る</a>' +
              reserveBtn(l, true) +
            '</div>' +
          '</div>' +
        '</article>';
      }).join("") + '</div>';
    };

    var lessons = '<section class="section" id="lessons"><div class="wrap">' +
      '<div class="section-head"><h2>開催中の教室</h2>' +
      '<p>日程と空き状況は、予約ページ（Airリザーブ）でご確認いただけます。</p></div>' +
      (open.length ? cards(open) :
        '<div class="empty"><p style="margin:0 0 6px">いまは募集中の教室がありません。</p>' +
        '<p style="margin:0;font-size:14px">次回の予定が決まりしだい、こちらに掲載します。</p></div>') +
      (closed.length ? '<div class="section-head" style="margin:56px 0 24px"><h2 style="font-size:20px">終了した教室</h2></div>' + cards(closed) : "") +
    '</div></section>';

    var flow = (s.flow && s.flow.length) ? '<section class="section section--paperwhite"><div class="wrap">' +
      '<div class="section-head"><h2>' + esc(s.flowHeading || "はじめての方へ") + '</h2></div>' +
      '<ol class="flow">' + s.flow.map(function(f){
        return '<li><h3>' + esc(f.title) + '</h3><p>' + esc(f.text) + '</p></li>';
      }).join("") + '</ol></div></section>' : "";

    var a = s.access || {};
    var rows = [["住所", a.address], ["駐車場", a.parking], ["電話", a.tel], ["メール", a.email], ["営業", a.hours]]
      .filter(function(r){ return r[1]; })
      .map(function(r){
        var v = esc(r[1]);
        if (r[0] === "電話") v = '<a href="tel:' + esc(String(r[1]).replace(/[^0-9+]/g,"")) + '">' + esc(r[1]) + '</a>';
        if (r[0] === "メール") v = '<a href="mailto:' + esc(r[1]) + '">' + esc(r[1]) + '</a>';
        return '<div><dt>' + esc(r[0]) + '</dt><dd>' + v + '</dd></div>';
      }).join("");

    var access = '<section class="section access" id="access"><div class="wrap">' +
      '<div class="section-head"><h2>アクセス</h2></div>' +
      '<div class="access-grid"><div><dl>' + rows + '</dl></div>' +
      '<div class="map"><iframe title="地図" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=' +
        encodeURIComponent(a.mapQuery || a.address || "") + '&z=15&output=embed"></iframe></div>' +
      '</div></div></section>';

    return header() + '<main>' + hero + lessons + flow + access + '</main>' + footer();
  }

  /* ---------- detail ---------- */
  function detail(id){
    var l = (DATA.lessons || []).filter(function(x){ return String(x.id) === id; })[0];
    if (!l) {
      return header() + '<main><div class="wrap"><div class="empty" style="margin:80px 0">' +
        '<p style="margin:0 0 16px">この教室のページは見つかりませんでした。</p>' +
        '<a class="btn btn-ghost" href="#/">教室一覧へ戻る</a></div></div></main>' + footer();
    }
    document.title = l.title + " | 寄せ植え教室 usual garden works";

    var embed = youtubeEmbed(l.videoUrl);
    var gal = (l.gallery || []).filter(Boolean);
    var galleryHtml = (gal.length || embed) ?
      '<h2 class="mincho" style="font-size:19px;margin:0 0 16px">当日のようす</h2><div class="gallery">' +
      gal.map(function(g){ return img(g, l.title + "のようす"); }).join("") +
      (embed ? '<div class="video"><iframe src="' + esc(embed) + '" title="動画" allowfullscreen loading="lazy"></iframe></div>' : "") +
      '</div>' : "";

    return header() + '<main class="detail"><div class="wrap">' +
      '<button class="back" type="button" onclick="history.length>1?history.back():location.hash=\'#/\'">← 教室一覧へ戻る</button>' +
      '<div class="detail-hero">' + img(l.image, l.title) +
        (l.status ? '<span class="chip' + (isOpen(l) ? "" : " is-full") + '">' + esc(l.status) + '</span>' : "") +
      '</div>' +
      '<div class="detail-grid">' +
        '<div><h1>' + esc(l.title) + '</h1>' +
          (l.schedule ? '<p class="when" style="font-size:15px">' + esc(l.schedule) + '</p>' : "") +
          '<p class="body">' + esc(l.desc) + '</p>' + galleryHtml + '</div>' +
        '<aside class="panel"><h2>募集要項</h2>' + specRows(l) +
          reserveBtn(l, true) +
          (isOpen(l) && safeUrl(l.reserveUrl) ? '<p class="note">Airリザーブの予約ページが開きます</p>' : "") +
        '</aside>' +
      '</div>' +
    '</div></main>' +
    '<div class="sticky-cta on">' + reserveBtn(l, true) + '</div>' +
    footer();
  }

  /* ---------- router ---------- */
  var currentView = null;

  function route(){
    var h = location.hash.replace(/^#/, "").replace(/^\//, "");
    var app = document.getElementById("app");
    var m = h.match(/^lesson\/(.+)$/);

    if (m) {
      app.innerHTML = detail(decodeURIComponent(m[1]));
      currentView = "detail:" + m[1];
      window.scrollTo(0, 0);
      return;
    }

    var target = h && document.getElementById(h);
    if (currentView === "home" && target) { target.scrollIntoView(); return; }

    document.title = "寄せ植え教室 | usual garden works（福島県いわき市）";
    app.innerHTML = home();
    currentView = "home";
    target = h && document.getElementById(h);
    if (target) { target.scrollIntoView(); } else { window.scrollTo(0, 0); }
  }

  function structuredData(){
    var s = DATA.site, a = s.access || {};
    var json = {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": s.name,
      "description": s.heroText || "",
      "telephone": a.tel || undefined,
      "email": a.email || undefined,
      "address": { "@type": "PostalAddress", "addressCountry": "JP", "addressRegion": "福島県", "streetAddress": a.address || "" },
      "url": location.origin + location.pathname
    };
    var el = document.createElement("script");
    el.type = "application/ld+json";
    el.textContent = JSON.stringify(json);
    document.head.appendChild(el);
  }

  function start(data){
    DATA = data;
    DATA.site = DATA.site || {};
    DATA.lessons = DATA.lessons || [];
    structuredData();
    window.addEventListener("hashchange", route);
    route();
  }

  function fallback(){
    try { return JSON.parse(document.getElementById("fallback-content").textContent); }
    catch (e) { return { site:{ name:"usual garden works" }, lessons:[] }; }
  }

  fetch("content.json", { cache: "no-cache" })
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(start)
    .catch(function(e){
      console.warn("content.json を読み込めませんでした。予備データで表示します。", e);
      start(fallback());
    });
})();
</script>
</body>
</html>
